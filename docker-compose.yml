services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: talktherapy-php
    env_file:
      - ./.env.docker
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    working_dir: /var/www/html
    restart: unless-stopped
    depends_on:
      - db
      - mailpit

  vite:
    image: node:20
    container_name: talktherapy-vite
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - php

  web:
    image: nginx:alpine
    container_name: talktherapy-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/html/public
    depends_on:
      - php
      - vite

  mailpit:
    image: axllent/mailpit:latest
    container_name: talktherapy-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  db:
    image: mysql:8.0
    container_name: talktherapy-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: talktherapy
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: talktherapy
      MYSQL_PASSWORD: secret
      MYSQL_ALLOW_EMPTY_PASSWORD:
      MYSQL_RANDOM_ROOT_PASSWORD:

    volumes:
      - talktherapy_db:/var/lib/mysql

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: talktherapy-queue
    env_file:
      - ./.env.docker
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./docker/queue/supervisord.conf:/etc/supervisord.conf
    command: bash -c "mkdir -p /var/www/html/storage/logs && chmod -R 777 /var/www/html/storage && touch /var/www/html/supervisord.log && chmod 777 /var/www/html/supervisord.log && supervisord -c /etc/supervisord.conf"
    depends_on:
      - php
      - db
      - mailpit

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: talktherapy-reverb
    env_file:
      - ./.env.docker
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./docker/reverb/supervisord.conf:/etc/supervisord.conf
      - ./docker/reverb/entrypoint.sh:/usr/local/bin/reverb-entrypoint.sh
    entrypoint: ["/usr/local/bin/reverb-entrypoint.sh"]
    ports:
      - "8081:8081"  # remapped from Reverb's default 8080 (conflicts with another local project)
    depends_on:
      - php
      - db
    restart: unless-stopped

volumes:
  talktherapy_db:
