services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: talktherapy-php
    env_file:
      - ./.env.docker
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    working_dir: /var/www/html
    restart: unless-stopped
    depends_on:
      - db
      - mailpit

  vite:
    # SCRUM-373: back after a host restart; the scheduler lives in queue and stopped silently.
    restart: unless-stopped
    image: node:20
    container_name: talktherapy-vite
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - php

  web:
    # SCRUM-373: back after a host restart; the scheduler lives in queue and stopped silently.
    restart: unless-stopped
    image: nginx:alpine
    container_name: talktherapy-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/html/public
    depends_on:
      - php
      - vite

  mailpit:
    image: axllent/mailpit:latest
    container_name: talktherapy-mailpit
    restart: unless-stopped
    # Host ports default to 1027/8027, not Mailpit's usual 1025/8025, which other local stacks
    # commonly hold -- a clash leaves this container unable to start, and the queue worker then
    # dies on every mail job (it can't resolve `mailpit`). Containers always use mailpit:1025
    # internally regardless. Override with MAILPIT_SMTP_PORT / MAILPIT_UI_PORT in the root .env.
    ports:
      - "${MAILPIT_SMTP_PORT:-1027}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8027}:8025" # Web UI

  db:
    image: mysql:8.0
    container_name: talktherapy-db
    restart: unless-stopped
    # SCRUM-362: lets the app user create the append-only triggers on the audit log while binary
    # logging is on (MySQL 8's default). Production's database needs the same setting.
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: talktherapy
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: talktherapy
      MYSQL_PASSWORD: secret
      MYSQL_ALLOW_EMPTY_PASSWORD:
      MYSQL_RANDOM_ROOT_PASSWORD:

    volumes:
      - talktherapy_db:/var/lib/mysql

  queue:
    # SCRUM-373: back after a host restart; the scheduler lives in queue and stopped silently.
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: talktherapy-queue
    env_file:
      - ./.env.docker
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./docker/queue/supervisord.conf:/etc/supervisord.conf
    # SCRUM-376: no `chmod -R 777 storage` -- it made private uploads (identity, licence and report-evidence
    # documents) world-writable. The entrypoint (docker/php/entrypoint.sh -> storage-permissions.sh) sets
    # storage up for www-data, which the worker and scheduler run as (docker/queue/supervisord.conf);
    # supervisord itself runs as root and writes its own log.
    command: bash -c "touch /var/www/html/supervisord.log && supervisord -c /etc/supervisord.conf"
    depends_on:
      - php
      - db
      - mailpit

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: talktherapy-reverb
    env_file:
      - ./.env.docker
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./docker/reverb/supervisord.conf:/etc/supervisord.conf
      - ./docker/reverb/entrypoint.sh:/usr/local/bin/reverb-entrypoint.sh
    # Through bash: the script is bind-mounted from the checkout, and git stores it without the
    # execute bit, so running it directly failed with "permission denied" on a fresh recreate.
    entrypoint: ["bash", "/usr/local/bin/reverb-entrypoint.sh"]
    ports:
      - "8081:8081"  # remapped from Reverb's default 8080 (conflicts with another local project)
    depends_on:
      - php
      - db
    restart: unless-stopped

volumes:
  talktherapy_db:
