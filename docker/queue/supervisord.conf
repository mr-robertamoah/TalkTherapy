[supervisord]
nodaemon=true

[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --timeout=60
numprocs=1
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/queue-worker.log
; SCRUM-333: runs Laravel's scheduler (routes/console.php) -- schedule:work stays in the foreground
; and checks every minute what's due, the in-container equivalent of a `* * * * * schedule:run`
; cron entry. Lives here rather than in its own container: same image/env as the queue worker, and
; scheduled jobs mostly dispatch queued work anyway.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
numprocs=1
autostart=true
autorestart=true
; schedule:work spawns a schedule:run child each minute -- stop/kill the whole group so a stop
; mid-run never orphans it.
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/scheduler.log
