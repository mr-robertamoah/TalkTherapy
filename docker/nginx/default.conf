server {
    listen 80;
    index index.php index.html;
    root /var/www/html/public;

    # Docker's embedded DNS (127.0.0.11), with a short TTL, so nginx re-resolves
    # "php" instead of caching its IP forever -- otherwise recreating the php
    # container (a new IP each time) leaves nginx pointing at a dead address
    # and every request 502s until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.ht {
        deny all;
    }
}
