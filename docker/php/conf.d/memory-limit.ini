; The base php:8.2-fpm image ships with no active php.ini, so memory_limit falls back to PHP's
; compiled-in default of 128M for every SAPI, including CLI -- too low to run the full Pest suite
; without --parallel (`php artisan test` OOMs partway through, even though the documented
; "Common commands" in CLAUDE.md list that exact command). Applies to both FPM and CLI since
; conf.d/*.ini files aren't SAPI-scoped in this Dockerfile.
memory_limit = 512M
